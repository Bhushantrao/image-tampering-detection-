{% extends 'base.html' %}

{% block content %}

<div class="row justify-content-center fade-up">

    <div class="col-lg-8">

        <div class="card custom-card p-5">

            <h2 class="text-center mb-3">

                <i class="bi bi-cloud-arrow-up-fill text-primary"></i>

                Upload Image

            </h2>

            <p class="text-center text-muted mb-4">

                Upload a JPG or PNG image to detect whether it has been tampered.

            </p>

            {% if error %}

            <div class="alert alert-danger">

                {{ error }}

            </div>

            {% endif %}

            <form method="POST"
                  enctype="multipart/form-data"
                  id="uploadForm">

                {% csrf_token %}

                <div class="upload-box">

                    <i class="bi bi-image fs-1 text-primary"></i>

                    <h4 class="mt-3">

                        Drag & Drop Image

                    </h4>

                    <p class="text-muted">

                        or click below to browse

                    </p>

                    <input type="file"
                           name="image"
                           id="imageInput"
                           class="form-control mt-3"
                           accept=".jpg,.jpeg,.png"
                           required>

                </div>

                <div class="text-center mt-4">

                    <img id="preview"
                         src=""
                         class="img-fluid shadow"
                         style="display:none; max-height:300px;">

                </div>

                <div class="text-center mt-5">

                    <button type="submit"
                            class="btn btn-primary btn-lg">

                        <i class="bi bi-search"></i>

                        Analyze Image

                    </button>

                </div>

            </form>

        </div>

    </div>

</div>

<!-- Loading Screen -->

<div id="loading">

    <div class="spinner-border text-primary"
         style="width:5rem;height:5rem;"
         role="status">

    </div>

    <h3 class="mt-4">

        AI is analyzing your image...

    </h3>

    <p>

        Please wait...

    </p>

</div>

{% endblock %}
